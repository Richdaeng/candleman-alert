<!doctype html>
<html lang="ko">
<head>

<meta name="robots" content="noindex">

<title>캔들맨 시그널 랩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 레이아웃: 어두운 남색 바탕에 패널을 쌓는 시세판. 위부터 지금 상태 → 봇의 선택 → 규칙 성적. 플러스는 빨강, 마이너스는 파랑. */
:root {
  color-scheme: dark;
  --ground: #0b1019;
  --panel: #111723;
  --card: #192130;
  --line: #2b3546;
  --ink: #f2f5fa;
  --ink-2: #aab4c4;
  --ink-3: #818da0;
  --up: #f2495e;
  --up-soft: rgba(242, 73, 94, .16);
  --down: #5a97fa;
  --down-soft: rgba(90, 151, 250, .16);
  --safe: #22b391;
  --bold: #8f7ff8;
  --hold: #8a96a8;
  --warn: #e9b44c;
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --t-xs: .75rem;
  --t-sm: .8125rem;
  --t-md: .9375rem;
  --t-lg: 1.125rem;
  --t-xl: 2rem;
}
* { box-sizing: border-box; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--t-md);
  line-height: 1.55;
  font-variant-numeric: tabular-nums;
  padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--bold); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.wrap { max-width: 1080px; margin-inline: auto; display: grid; gap: 14px; }
.wrap > *, .view > * { min-width: 0; }
.view { display: grid; gap: 14px; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.brand { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.brand h1 { font-size: var(--t-lg); font-weight: 800; letter-spacing: -.01em; }
.brand span { font-size: var(--t-xs); color: var(--ink-3); }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; max-width: 100%; }
.seg button { padding: 6px 14px; min-height: 36px; border-radius: 7px; color: var(--ink-2); font-size: var(--t-sm); font-weight: 500; white-space: nowrap; }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 700; }
.sub { display: flex; gap: 20px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.sub button { padding: 8px 2px 10px; color: var(--ink-3); font-size: var(--t-sm); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.sub button[aria-selected="true"] { color: var(--ink); border-color: var(--ink); font-weight: 700; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; }
.panel-head h2 { font-size: var(--t-md); font-weight: 700; text-wrap: balance; }
.minor { font-size: var(--t-sm); font-weight: 700; }
.label { font-size: var(--t-sm); color: var(--ink-2); }
.pill { display: inline-flex; align-items: center; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink-2); font-size: var(--t-xs); white-space: nowrap; }
.pill.live { color: var(--safe); border-color: var(--safe); }
.pill.old { color: var(--warn); border-color: var(--warn); }
.line { font-size: var(--t-sm); color: var(--ink-2); }
.line.warn { color: var(--warn); }
.line b { color: var(--ink); font-weight: 500; }
.note { font-size: var(--t-xs); color: var(--ink-3); line-height: 1.6; }
.big { font-size: var(--t-xl); font-weight: 800; line-height: 1.15; letter-spacing: -.01em; overflow-wrap: anywhere; }
.up { color: var(--up); }
.down { color: var(--down); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.two > * { min-width: 0; }

.rule { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--tone); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.safe, .small { --tone: var(--safe); }
.bold, .big-rule { --tone: var(--bold); }
.rule-head { display: flex; align-items: center; gap: 8px; }
.rule-head h3 { font-size: var(--t-md); font-weight: 700; }
.rule-head .pill { margin-left: auto; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--tone); flex: none; }
.line .dot, td .dot { margin-right: 6px; }
.choice { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 4px; font-size: var(--t-md); }
.choice strong { font-weight: 700; }
.state { display: inline-flex; padding: 1px 8px; border-radius: 6px; font-size: var(--t-xs); font-weight: 700; white-space: nowrap; background: var(--line); color: var(--ink-2); }
.state.in { background: var(--up-soft); color: var(--up); }
.state.out { background: var(--down-soft); color: var(--down); }
.mini { width: 100%; border-collapse: collapse; font-size: var(--t-sm); margin-block: 2px; }
.mini th, .mini td { padding: 3px 0 3px 10px; text-align: right; font-weight: 400; color: var(--ink-3); white-space: nowrap; }
.mini th:first-child, .mini td:first-child { padding-left: 0; text-align: left; }
.mini td:not(:first-child) { color: var(--ink); }
.mini td.up { color: var(--up); }
.mini td.down { color: var(--down); }

.r-body { position: relative; margin-left: 40px; padding-top: 24px; display: grid; gap: 6px; }
.r-row { position: relative; }
.r-row::before { content: attr(data-name); position: absolute; right: calc(100% + 8px); top: 50%; transform: translateY(-50%); font-size: var(--t-xs); color: var(--ink-2); white-space: nowrap; }
.r-track { display: flex; gap: 2px; height: 26px; border-radius: 6px; overflow: hidden; }
.r-seg { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; white-space: nowrap; font-size: .6875rem; color: var(--ink-2); background: var(--line); }
.r-seg.long { background: var(--up-soft); color: var(--up); }
.r-seg.short { background: var(--down-soft); color: var(--down); }
.r-now { position: absolute; top: 18px; bottom: 26px; width: 2px; margin-left: -1px; background: var(--ink); }
.r-now-label { position: absolute; top: 0; font-size: var(--t-xs); font-weight: 700; white-space: nowrap; }
.r-ticks { position: relative; height: 20px; font-size: var(--t-xs); color: var(--ink-2); }
.r-ticks span { position: absolute; top: 2px; transform: translateX(-50%); white-space: nowrap; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.controls select { min-height: 42px; padding: 0 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font-size: var(--t-sm); max-width: 100%; }
.tally { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.tally div { background: var(--card); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.tally span { font-size: var(--t-xs); color: var(--ink-3); }
.tally strong { font-size: var(--t-lg); font-weight: 700; }
.chip { display: inline-flex; padding: 1px 8px; border-radius: 6px; font-size: var(--t-xs); font-weight: 700; white-space: nowrap; background: var(--line); color: var(--ink-2); }
.chip.hit { background: var(--up-soft); color: var(--up); }
.chip.miss { background: var(--down-soft); color: var(--down); }

.log { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
.log th { padding: 6px 8px; text-align: left; font-size: var(--t-xs); font-weight: 500; color: var(--ink-3); border-bottom: 1px solid var(--line); white-space: nowrap; }
.log td { padding: 8px; border-bottom: 1px solid var(--card); color: var(--ink-2); white-space: nowrap; }
.log td.c-rule { color: var(--ink); }
.log th.num, .log td.num { text-align: right; }
.log td.c-ret { font-weight: 700; }
.log td.c-ret.up { color: var(--up); }
.log td.c-ret.down { color: var(--down); }
.days { color: var(--ink-3); }

.table-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
.tbl th { padding: 6px 8px; text-align: right; font-size: var(--t-xs); font-weight: 500; color: var(--ink-3); border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--card); white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; color: var(--ink-2); }
.tbl td b, .tbl td span { display: block; font-weight: 500; }
.tbl td span { font-size: var(--t-xs); opacity: .78; }
.tbl tr.me td:first-child { color: var(--ink); font-weight: 700; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: var(--t-sm); color: var(--ink-2); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--t-xs); color: var(--ink-2); }
.legend i { display: inline-block; width: 14px; height: 2px; margin-right: 6px; vertical-align: middle; border-radius: 1px; }
.chart { position: relative; min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.tip { position: absolute; top: 8px; z-index: 2; pointer-events: none; padding: 6px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; font-size: var(--t-xs); color: var(--ink); white-space: nowrap; }
.tip div { color: var(--ink-2); }
.foot { font-size: var(--t-xs); color: var(--ink-3); text-align: center; line-height: 1.7; }

@media (max-width: 720px) {
  .two { grid-template-columns: minmax(0, 1fr); }
  .tally { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .pill { white-space: normal; }
  .log thead { display: none; }
  .log, .log tbody { display: block; }
  .log tr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 3px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--card); }
  .log td { display: block; padding: 0; border: 0; white-space: normal; }
  .log td.c-rule { grid-area: 1 / 1; }
  .log td.c-ret { grid-area: 1 / 2; }
  .log td.c-res { grid-area: 1 / 3; }
  .log td.c-date { grid-area: 2 / 1 / 2 / 4; font-size: var(--t-xs); }
  .log td.c-px { grid-area: 3 / 1 / 3 / 4; font-size: var(--t-xs); text-align: left; }
  .log td.c-kind { grid-area: 4 / 1 / 4 / 4; font-size: var(--t-xs); text-align: left; }
}
@media (prefers-reduced-motion: no-preference) {
  .sub button, .seg button { transition: color .12s ease; }
}

  if (!t) return { cls: "", tag: "쉼", head: "오늘은 쉽니다", why: "판정 자료를 받지 못했어요." };
  if (t.go.includes(key)) {
    const c = t.top.close;
    const s = seed.ipo.stat[key];
    return { cls: "in", tag: "진입 신호", head: `${esc(t.top.name)} ${num(c)}원`, why: `${md(nextDay(t.day))} 익절 ${num(Math.round(c * (1 + C[1])))}원 · 손절 ${num(Math.round(c * (1 + C[2])))}원 · 적중 ${Math.round(s.win / s.n * 100)}%` };
  }
  return { cls: "", tag: "쉼", head: "오늘은 쉽니다", why: `거래대금 1위가 ${C[3]} 원에 못 미쳐요.` };
}

function ipoLogBody() {

/* 차트 */
function lineChart(box, cfg) {
  if (!box) return;
  const W = Math.max(280, box.clientWidth || 640), H = W < 480 ? 230 : 280, m = { l: 42, r: W < 480 ? 76 : 104, t: 12, b: 24 };
  const pos = cfg.pos, n = pos.length, x0 = pos[0], x1 = pos[n - 1], f = cfg.log ? Math.log10 : (v => v);
  const lo = cfg.lo, hi = cfg.hi;
  const X = p => m.l + (W - m.l - m.r) * (p - x0) / (x1 - x0);
  const Y = v => H - m.b - (H - m.t - m.b) * (f(v) - f(lo)) / (f(hi) - f(lo));
  const grid = cfg.ticks.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" style="stroke:var(--line);stroke-width:1"></line><text x="${m.l - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" style="fill:var(--ink-3);font-size:11px">${cfg.tickText(v)}</text>`).join("");
  let last = -1e9;
  const xs = cfg.xticks.filter(([p]) => { if (X(p) - last < 36) return false; last = X(p); return true; }).map(([p, t]) => `<text x="${X(p).toFixed(1)}" y="${H - 6}" text-anchor="middle" style="fill:var(--ink-3);font-size:11px">${t}</text>`).join("");
  const ends = cfg.series.map(s => ({ s, y: Y(s.y[n - 1]) })).sort((a, b) => a.y - b.y);
  ends.forEach((e, i) => { e.ty = i ? Math.max(e.y, ends[i - 1].ty + 15) : e.y; });
  const trace = s => s.y.map((v, i) => !i ? `M${X(pos[0]).toFixed(1)} ${Y(v).toFixed(1)}` : cfg.step ? `H${X(pos[i]).toFixed(1)}V${Y(v).toFixed(1)}` : `L${X(pos[i]).toFixed(1)} ${Y(v).toFixed(1)}`).join("");
  const lines = cfg.series.map(s => `<path d="${trace(s)}" style="fill:none;stroke:${s.color};stroke-width:2;stroke-linejoin:round;stroke-linecap:round"></path>
    <circle cx="${X(x1).toFixed(1)}" cy="${Y(s.y[n - 1]).toFixed(1)}" r="4" style="fill:${s.color};stroke:var(--panel);stroke-width:2"></circle>`).join("");
  const labels = ends.map(e => `<text x="${X(x1) + 9}" y="${(e.ty + 4).toFixed(1)}" style="fill:var(--ink-2);font-size:11px">${e.s.name} ${cfg.valText(e.s.y[n - 1])}</text>`).join("");
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${cfg.label}">${grid}${xs}${lines}${labels}<line class="hair" y1="${m.t}" y2="${H - m.b}" style="stroke:var(--ink-3);stroke-width:1;display:none"></line><rect class="hit" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" style="fill:transparent"></rect></svg><div class="tip" hidden></div>`;
  const hair = box.querySelector(".hair"), tip = box.querySelector(".tip"), hit = box.querySelector(".hit");
  const move = e => {
    const r = box.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width, aim = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0);
    let i = 0;
    pos.forEach((p, k) => { if (Math.abs(p - aim) < Math.abs(pos[i] - aim)) i = k; });
    hair.setAttribute("x1", X(pos[i])); hair.setAttribute("x2", X(pos[i])); hair.style.display = "";
    tip.hidden = false;
    tip.innerHTML = `<strong>${cfg.x[i]}</strong>` + cfg.series.map(s => `<div>${s.name} ${cfg.valText(s.y[i])}</div>`).join("");
    const left = X(pos[i]) * r.width / W;
    tip.style.left = (left > r.width / 2 ? left - tip.offsetWidth - 10 : left + 10) + "px";
  };
  const out = () => { hair.style.display = "none"; tip.hidden = true; };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", out);
}
function drawCharts() {
  if ($("chart-btc")) {
    const c = seed.curve, all = c.flatMap(r => r.slice(1));
    const ticks = [1, 10, 100, 1000].filter(v => v <= Math.max(...all) * 1.2);
    lineChart($("chart-btc"), {
      label: "2019년부터 과감한 수익 · 보유 · 안전 진입의 자산 곡선", log: true, x: c.map(r => r[0]), pos: c.map((_, i) => i), lo: Math.min(.5, Math.min(...all)), hi: Math.max(...all) * 1.15, ticks,
      tickText: v => num(v) + "배", valText: v => signed((v - 1) * 100, 0),
      xticks: c.map((r, i) => [i, r[0]]).filter(([, t]) => t.endsWith("-01")).map(([i, t]) => [i, t.slice(0, 4)]),
      series: [{ name: "과감", color: "var(--bold)", y: c.map(r => r[3]) }, { name: "보유", color: "var(--hold)", y: c.map(r => r[1]) }, { name: "안전", color: "var(--safe)", y: c.map(r => r[2]) }]
    });
  }
  if ($("chart-ipo")) {
    const I = seed.ipo, T = I.trades, days = [I.from, ...new Set(T.map(t => t.next).sort())];
    const dayNo = d => (Date.parse(d + "T00:00:00Z") - Date.parse(I.from + "T00:00:00Z")) / DAY;
    const walk = key => { let e = 1; return days.map(d => { const a = T.find(t => t.rule === key && t.next === d); if (a) e = a.eq; return e; }); };
    const big = walk("big"), small = walk("small"), all = big.concat(small);
    const hi = Math.max(...all) * 1.06, lo = Math.min(...all) * .94;
    const ticks = [.5, 1, 1.5, 2, 2.5, 3, 3.5].filter(v => v >= lo && v <= hi);
    const months = [...new Set(days.map(d => d.slice(0, 7)))];
    lineChart($("chart-ipo"), {
      label: "신규 추격 두 규칙의 누적 수익 곡선", log: false, step: true, x: days.map(md), pos: days.map(dayNo), lo, hi, ticks,
      tickText: v => v.toFixed(1) + "배", valText: v => signed((v - 1) * 100, 0),
      xticks: months.map(m => [Math.max(0, dayNo(m + "-01")), +m.slice(5) + "월"]),
      series: [{ name: "짧게", color: "var(--safe)", y: small }, { name: "크게", color: "var(--bold)", y: big }]
    });
  }
}

/* 화면 전환 · 시세 */
const RENDER = { btc: viewBtc, "btc-log": viewBtcLog, "btc-stats": viewBtcStats, ipo: viewIpo, "ipo-log": viewIpoLog, "ipo-stats": viewIpoStats, "ipo-next": viewIpoNext };
function render() {
  const market = VIEWS[S.view][0];
  $("m-btc").setAttribute("aria-selected", market === "btc");
  $("m-ipo").setAttribute("aria-selected", market === "ipo");
  $("sub").innerHTML = Object.keys(VIEWS).filter(k => VIEWS[k][0] === market).map(k => `<button role="tab" data-go="${k}" aria-selected="${k === S.view}">${VIEWS[k][1]}</button>`).join("");
  $("view").innerHTML = RENDER[S.view]();
  drawCharts();
  tick();
}
function go(v) {
  if (!VIEWS[v] || v === S.view) return;
  S.view = v;
  try { history.replaceState(null, "", "#" + v); } catch (e) { /* 주소를 못 바꿔도 화면은 바뀜 */ }
  render();
  window.scrollTo(0, 0);
}
function tick() {
  const now = Date.now(), st = S.st, px = S.spot;
  const gain = k => st[k].w * (px / st[k].entry - 1) * 100;
  const fill = (id, t) => { const el = $(id); if (el) el.textContent = t; };
  fill("px", "$" + num(px, 2));
  const change = (px / st.close - 1) * 100, sub = $("px-sub");
  if (sub) sub.innerHTML = `${when(st.end)} 종가 대비 <span class="${tone(change)}">${signed(change, 2)}</span> · ${clock(S.spotAt)} 기준`;
  const pill = $("px-state");
  if (pill) { pill.textContent = S.live ? "실시간" : "게시 시점 값"; pill.className = "pill " + (S.live ? "live" : "old"); }
  const note = $("px-note");
  if (note) {
    const late = now >= st.next_end;
    note.hidden = S.live;
    note.textContent = late ? `이 값은 ${when(S.spotAt)}에 받아 둔 값이고 그 뒤 판정이 지났어요. 최신 판정은 디스코드 시그널에서 보세요.` : `이 주소에서는 바깥 시세를 받을 수 없어서 ${when(S.spotAt)}에 받아 둔 값을 보여 줘요.`;
  }
  const left = st.next_end - now;
  if (left > 0) fill("eta", `${Math.floor(left / 3600000)}시간 ${Math.floor(left % 3600000 / 60000)}분 남음`);
  else fill("eta", S.live ? "판정을 받는 중이에요" : "판정 시각이 지났어요");
  document.querySelectorAll("[data-gain]").forEach(el => { const v = gain(el.dataset.gain); el.textContent = signed(v, 1); el.className = tone(v); });
  document.querySelectorAll("[data-gain-cell]").forEach(el => { const v = gain(el.dataset.gainCell); el.textContent = signed(v, 1); el.className = "c-ret num " + tone(v); });
  document.querySelectorAll("[data-now]").forEach(el => { el.textContent = usd(px); });
  const mark = $("r-now"), label = $("r-label");
  if (mark && S.scale) {
    const x = Math.max(0, Math.min(100, (px - S.scale.lo) / (S.scale.hi - S.scale.lo) * 100));
    mark.style.left = x + "%";
    label.style.left = x + "%";
    label.style.transform = x < 16 ? "none" : x > 84 ? "translateX(-100%)" : "translateX(-50%)";
    label.textContent = "지금 " + usd(px);
  }
}
async function pullPrice() {
  try {
    const r = await fetch(API + "ticker/price?symbol=BTCUSDT", { cache: "no-store" });
    if (!r.ok) throw new Error("price");
    const j = await r.json();
    S.spot = Number(j.price);
    S.spotAt = Date.now();
    S.live = true;
  } catch (e) {
    S.live = false;
  }
  tick();
  if (S.live && Date.now() >= S.st.next_end + 30000) pullBars();
  setTimeout(pullPrice, S.live ? 5000 : 60000);
}
async function pullBars() {
  try {
    const r = await fetch(API + "klines?symbol=BTCUSDT&interval=1d&timeZone=10&limit=500", { cache: "no-store" });
    if (!r.ok) throw new Error("bars");
    const now = Date.now(), bars = (await r.json()).filter(x => Number(x[6]) < now).map(x => [Number(x[6]) + 1, Number(x[1]), Number(x[4])]);
    if (bars.length < 110) return;
    const changed = bars[bars.length - 1][0] !== S.bars[S.bars.length - 1][0];
    S.bars = bars;
    if (changed || !S.barsLive) { S.st = readBars(bars); S.barsLive = true; render(); }
  } catch (e) { /* 받아 둔 값으로 계속 */ }
}
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.go) go(b.dataset.go);
  if (b.dataset.set) {
    const [id, v] = b.dataset.set.split(":"), [group, field] = id.split("-");
    (group === "log" ? S.log : S.ipoLog)[field] = v;
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    if (group === "log") $("log-body").innerHTML = btcLogBody();
    else $("ilog-body").innerHTML = ipoLogBody();
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "log-year") { S.log.year = e.target.value; $("log-body").innerHTML = btcLogBody(); }
  if (e.target.id === "ilog-month") { S.ipoLog.month = e.target.value; $("ilog-body").innerHTML = ipoLogBody(); }
});
let wait = 0;
window.addEventListener("resize", () => { cancelAnimationFrame(wait); wait = requestAnimationFrame(drawCharts); });
window.addEventListener("hashchange", () => go(location.hash.slice(1)));
if (VIEWS[location.hash.slice(1)]) S.view = location.hash.slice(1);
S.st = readBars(S.bars);
$("built").textContent = "자료 " + seed.built.slice(5).replace("-", "/").replace(/^0/, "");
render();
pullPrice();
pullBars();
setInterval(tick, 20000);
</script>

</body>
